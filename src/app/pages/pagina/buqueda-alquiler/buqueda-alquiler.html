<div class="search-results-wrapper">
    <div class="grid grid-cols-12 gap-8 pt-6">
        <!-- Panel de Filtros -->
        <div class="col-span-12 lg:col-span-3">
            <app-filtro-alquiler #filtroAlquiler (onFilterChange)="handleFilter($event)"></app-filtro-alquiler>
        </div>

        <!-- Listado de Resultados -->
        <div class="col-span-12 lg:col-span-9">
            <div class="results-header">
                <div class="header-left">
                    <p class="location-label">Zaragoza y alrededores</p>
                    <h2 class="main-title">Propiedades en Alquiler</h2>
                </div>
                <div class="count-badge">
                    <span class="count-number">{{ inmueblesFiltrados.length }}</span>
                    <span class="count-text">Inmuebles encontrados</span>
                </div>
            </div>

            <p-dataView #dv [value]="inmueblesFiltrados" layout="list" [rows]="10" [paginator]="true" class="custom-dataview">
                <ng-template #list let-items>
                    <div class="results-grid">
                        <div *ngFor="let item of items">
                            <app-alquiler [inmueble]="item" (onVerDetalle)="seleccionarInmueble($event)"></app-alquiler>
                        </div>
                    </div>
                </ng-template>

                <ng-template #empty>
                    <div class="empty-state-card">
                        <div class="empty-icon-wrap">
                            <i class="pi pi-search"></i>
                        </div>
                        <h3 class="empty-title">No hay resultados</h3>
                        <p class="empty-text">Prueba a ajustar los filtros para encontrar lo que buscas.</p>
                        <button pButton label="Limpiar filtros" class="btn-outline-premium mt-4" (click)="limpiarFiltros()"></button>
                    </div>
                </ng-template>
            </p-dataView>
        </div>
    </div>
</div>
