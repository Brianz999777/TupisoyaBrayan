<p-toast position="top-right" />

<div class="max-w-[90rem] mx-auto px-8 lg:px-24 py-8">
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
    <!-- Panel de Filtros -->
    <div class="lg:col-span-3">
      <app-filtro-venta #filtroVenta (onFilterChange)="handleFilter($event)"></app-filtro-venta>
    </div>

    <!-- Listado de Resultados -->
    <div class="lg:col-span-9">
      <!-- Header -->
      <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-8 pb-6 border-b border-gray-100 dark:border-gray-800">
        <div class="inline-flex items-center gap-2.5 bg-gray-900 dark:bg-gray-100 px-5 py-2.5 rounded-2xl shadow-lg">
          <span class="text-lg font-black text-emerald-400 dark:text-emerald-600">{{ inmueblesFiltrados.length }}</span>
          <span class="text-sm font-bold text-white dark:text-gray-900">Inmuebles encontrados</span>
        </div>
      </div>

      <!-- Results -->
      <p-dataView #dv [value]="inmueblesFiltrados" layout="list" [rows]="10" [paginator]="true" class="custom-dataview">
        <ng-template #list let-items>
          <div class="flex flex-col gap-5">
            <div *ngFor="let item of items">
              <app-venta [inmueble]="item" (onVerDetalle)="seleccionarInmueble($event)"></app-venta>
            </div>
          </div>
        </ng-template>

        <ng-template #empty>
          <div class="flex flex-col items-center justify-center py-20 px-6 bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 text-center">
            <div class="w-20 h-20 rounded-full bg-gray-50 dark:bg-gray-700 flex items-center justify-center mb-6">
              <i class="pi pi-search text-3xl text-gray-300"></i>
            </div>
            <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-2">No hay resultados</h3>
            <p class="text-gray-500 dark:text-gray-400 max-w-xs mb-6">Prueba a ajustar los filtros para encontrar lo que buscas.</p>
            <button pButton label="Limpiar filtros"
              class="!bg-gradient-to-r !from-emerald-500 !to-teal-500 !text-white !font-bold !rounded-full !border-0 !px-6 !py-2.5 hover:!from-emerald-600 hover:!to-teal-600 !transition-all !shadow-md !shadow-emerald-500/20"
              (click)="limpiarFiltros()"></button>
          </div>
        </ng-template>
      </p-dataView>
    </div>
  </div>
</div>

<!-- ─── MODAL ALERTA ──────────────────────────────────── -->
<p-dialog
  header="¿Quieres recibir alertas?"
  [(visible)]="mostrarModalAlerta"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{width: '420px'}"
  class="alerta-dialog">
  <div class="flex flex-col items-center text-center p-2">
    <div class="w-16 h-16 rounded-full bg-gradient-to-br from-emerald-400 to-teal-500 flex items-center justify-center mb-4">
      <i class="pi pi-bell text-2xl text-white"></i>
    </div>
    <p class="text-gray-600 dark:text-gray-300 mb-5">
      Te avisaremos por correo cuando haya <strong>nuevos inmuebles en venta</strong> que coincidan con tu búsqueda.
    </p>
    <div class="w-full flex flex-col gap-3">
      <input
        type="email"
        pInputText
        placeholder="tu@email.com"
        class="w-full text-center"
        [(ngModel)]="correoAlerta"
      />
      <button
        pButton
        [disabled]="guardandoAlerta"
        (click)="crearAlerta()"
        label="Crear alerta"
        icon="pi pi-check"
        class="!bg-gradient-to-r !from-emerald-500 !to-teal-500 !text-white !font-bold !rounded-full !border-0 !px-6 !py-2.5 hover:!from-emerald-600 hover:!to-teal-600 !transition-all !shadow-lg !shadow-emerald-500/25 !w-full"
      ></button>
    </div>
    <button
      class="mt-4 text-sm text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors font-medium"
      (click)="cerrarModalAlerta()">
      No, gracias
    </button>
  </div>
</p-dialog>
